# Fabrique l'`.aab` et l'envoie sur Google Play.
#
# Deux déclencheurs :
#   - un tag `v*` → test interne
#   - un lancement manuel → piste au choix
#
# Le `versionCode` est calculé, jamais saisi : Play refuse un numéro déjà
# utilisé, et c'est une faute facile à faire à la main. Relever BASE quand
# des versions ont été envoyées à la main avant la CI.

name: Publier sur Google Play

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      piste:
        description: Piste de publication
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

env:
  BASE_VERSION_CODE: 0

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: npm run preparer

      - name: Reconstituer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p credentials
          echo "$KEYSTORE_BASE64" | base64 -d > credentials/keystore.jks

      - name: Calculer le versionCode
        run: echo "VERSION_CODE=$((BASE_VERSION_CODE + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Générer le projet Android
        run: |
          npx cap add android || npx cap sync android
          # Capacitor régénère ce fichier : on y réécrit la version à chaque
          # fois plutôt que de la committer.
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$(node -p "require('./package.json').version")\"/" android/app/build.gradle

      - name: Fabriquer l'.aab
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          ./gradlew app:bundleRelease -x lint -x test \
            "-Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/credentials/keystore.jks" \
            "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"

      # Un `.aab` peut s'installer sans erreur en embarquant une version
      # périmée du jeu. On vérifie que le code est bien celui du dépôt.
      - name: Vérifier le contenu
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          unzip -p "$AAB" base/assets/public/jeu.js > /tmp/embarque.js
          diff -q /tmp/embarque.js www/jeu.js \
            || { echo "Le paquet ne contient pas la version du dépôt."; exit 1; }

      - name: Envoyer sur Google Play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          NOTES=""
          if [ -f notes-de-version.txt ]; then NOTES="--notes notes-de-version.txt"; fi
          node tools/publier.mjs \
            android/app/build/outputs/bundle/release/app-release.aab \
            --piste "${{ inputs.piste || 'internal' }}" $NOTES

      - name: Effacer la clé
        if: always()
        run: rm -rf credentials
